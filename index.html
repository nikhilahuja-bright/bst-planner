/* ===== Toasts ===== */

.grid-wrap { height: 100%; overflow: auto; padding: 16px; }

.cell-btn:hover { border-color: var(--border); }
.cell-late { color: var(--danger); }

.cal-add { opacity: 0; }
.cal-cell:hover .cal-add, .cal-add:focus-visible { opacity: 1; }
.cal-chip {
  display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border);

.cal-chip span { overflow: hidden; text-overflow: ellipsis; }

.cal-chip.done span { text-decoration: line-through; color: var(--muted); }
.cal-chip.late { border-left-color: var(--danger); }
.cal-chip.dragging { opacity: .4; }

.cal-side { width: 270px; flex-shrink: 0; border-left: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; transition: background .12s; }
.cal-side.drop-over { background: var(--accent-soft); }
.cal-side h3 { margin: 4px 0 6px; font-size: 14px; }

/* ===== Charts ===== */
.charts-wrap { height: 100%; overflow-y: auto; padding: 16px; }
.charts-summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

  .cal-wrap { flex-direction: column; }

  .cal-chip { font-size: 11px; padding: 2px 4px; }

  .modal { max-height: 100vh; }

.sync-pill { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--border); background: transparent; color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }

.sync-offline .sync-dot { background: var(--danger); }

@keyframes syncPulse { 50% { opacity: .35; } }
body.gated #app, body.gated #panel, body.gated #drawer { display: none !important; }

.gate-create { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px dashed var(--border); border-radius: 8px; }

        assignees: task.assignees.slice(), labels: task.labels.slice(), notes: task.notes, showChecklist: task.showChecklist,

/** Due-date bucket for a date string. */
function dueGroup(s) {
  if (!s) return 'nodate';
  const T = todayISO();
  if (s < T) return 'late';
  if (s === T) return 'today';
  if (s === addDays(T, 1)) return 'tomorrow';
  const sow = startOfWeek(T, state.board.weekStart);
  if (s <= addDays(sow, 6)) return 'thisweek';
  if (s <= addDays(sow, 13)) return 'nextweek';
  return 'future';
}
/** The columns for the current "Group by" mode. */
function getGroups() {

    case 'progress': return PROGRESS.map(p => ({ key: p, title: t('prog_' + p), color: STATUS_COLORS[p], iconName: progressIconName(p) }));
    case 'priority': return PRIORITY.map(p => ({ key: p, title: t('pri_' + p), color: PRIORITY_COLORS[p], iconName: p }));
    case 'due': return DUE_GROUPS.map(k => ({ key: k, title: t('due_' + k), color: k === 'late' ? STATUS_COLORS.late : '' }));
    case 'assigned': return state.members.map(m => ({ key: m.id, title: m.name, member: m })).concat([{ key: 'none', title: t('unassigned') }]);
    case 'labels': return state.labels.map(l => ({ key: l.id, title: labelText(l), color: l.color })).concat([{ key: 'none', title: t('noLabel') }]);

/** Which group keys a task belongs to (multi-valued for assignees / labels). */
function taskGroupKeys(task) {

    case 'progress': return [task.progress];
    case 'priority': return [task.priority];
    case 'due': return [dueGroup(task.due)];
    case 'assigned': { const a = task.assignees.filter(memberById); return a.length ? a : ['none']; }
    case 'labels': { const l = task.labels.filter(labelById); return l.length ? l : ['none']; }

/** Apply the field change implied by dragging a task from one group to another. Returns false when not allowed. */
function applyGroupMove(task, fromKey, toKey) {
  if (fromKey === toKey) return true;
  const T = todayISO();
  switch (state.board.groupBy) {
    case 'progress':
      if (toKey === 'completed') setCompleted(task, true);
      else { if (task.progress === 'completed') setCompleted(task, false); task.progress = toKey; }
      break;
    case 'priority': task.priority = toKey; break;
    case 'due': {
      const sow = startOfWeek(T, state.board.weekStart);
      const map = {
        today: T, tomorrow: addDays(T, 1), nodate: null,
        thisweek: addDays(sow, 6) > addDays(T, 1) ? addDays(sow, 6) : addDays(T, 1),
        nextweek: addDays(sow, 7), future: addDays(sow, 14)
      };
      if (toKey === 'late') { toast(t('lateMove')); return false; }
      task.due = map[toKey];
      if (task.due && task.start && task.start > task.due) task.start = task.due;
      break;
    }
    case 'assigned':
      task.assignees = task.assignees.filter(a => a !== fromKey);
      if (toKey === 'none') task.assignees = [];
      else if (!task.assignees.includes(toKey)) task.assignees.push(toKey);
      break;
    case 'labels':
      task.labels = task.labels.filter(l => l !== fromKey);
      if (toKey === 'none') task.labels = [];

    case 'priority': return { priority: key };

      const m = { late: addDays(T, -1), today: T, tomorrow: addDays(T, 1), thisweek: addDays(sow, 6), nextweek: addDays(sow, 7), future: addDays(sow, 14), nodate: null };

    );

function exportJSON() {
  const name = (state.board.name || 'board').replace(/[^\w-]+/g, '-').toLowerCase();
  downloadText(`bst-${name}-${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json');
}
function importJSON() {
  const input = h('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' } });
  input.addEventListener('change', () => {
    const file = input.files && input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const keepPrefs = state.board;
        state = normalizeState(parsed && parsed.kind === 'bst-planner-backup' ? parsed.state : parsed);
        if (appMode === 'cloud') { PREF_FIELDS.forEach(k => { state.board[k] = keepPrefs[k]; }); ensureUuids(); }
        ui.openTaskId = null; document.getElementById('panel').classList.remove('open');
        ui.modals.slice().forEach(m => m.close());
        applyTheme(); commit(); toast(t('importOk'));
      } catch (e) { toast(t('importFail')); }
    };
    reader.readAsText(file);
    input.remove();
  });
  document.body.appendChild(input); input.click();
}
function exportCSV() {
  const esc = (v) => { const s = String(v == null ? '' : v); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const header = ['ID', 'Title', 'Bucket', 'Progress', 'Priority', 'Assigned to', 'Labels', 'Start date', 'Due date', 'Late', 'Repeat', 'Checklist', 'Notes', 'Attachments', 'Comments', 'Created', 'Modified', 'Completed'];
  const rows = state.tasks.slice().sort((a, b) => state.buckets.findIndex(x => x.id === a.bucketId) - state.buckets.findIndex(x => x.id === b.bucketId) || byOrder(a, b)).map(x => [
    x.id, x.title, (bucketById(x.bucketId) || {}).name || '', t('prog_' + x.progress), t('pri_' + x.priority),
    x.assignees.map(memberById).filter(Boolean).map(m => m.name).join('; '),
    x.labels.map(labelById).filter(Boolean).map(l => l.name).join('; '),
    x.start || '', x.due || '', isLate(x) ? 'yes' : 'no', t('rep_' + x.repeat),
    x.checklist.filter(c => c.done).length + '/' + x.checklist.length, x.notes,
    x.attachments.map(a => a.url).join(' '), x.comments.length,
    new Date(x.created).toISOString(), new Date(x.modified).toISOString(), x.completedAt ? new Date(x.completedAt).toISOString() : ''
  ]);
  const csv = '\ufeff' + [header].concat(rows).map(r => r.map(esc).join(',')).join('\r\n');
  downloadText(`bst-tasks-${todayISO()}.csv`, csv, 'text/csv;charset=utf-8');
}

/* ================== 12. KEYBOARD SHORTCUTS & BOOTSTRAP ================== */
function isTyping(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}
function startNewTask() {
  if (state.board.view !== 'board' && state.board.view !== 'grid') { state.board.view = 'board'; save(); renderTopbar(); }
  if (state.board.view === 'grid') { ui.focusGridAdd = true; renderMain(); return; }
  const g = getGroups().find(x => !isGroupCollapsed(x)) || getGroups()[0];
  if (!g) return;
  ui.quickAdd = { group: g.key, title: '', due: '', assignee: '' }; ui.focusQuickAdd = true; renderMain();
}
document.addEventListener('keydown', (e) => {
  const typing = isTyping(e.target);
  if (e.key === 'Escape') {
    if (ui.menu) { e.preventDefault(); closeMenu(true); return; }
    if (ui.modals.length) { e.preventDefault(); ui.modals[ui.modals.length - 1].close(); return; }
    if (typing) return; // let the field handle it (spec: ignore while typing)
    if (ui.filterOpen) { toggleFilterDrawer(false); return; }
    if (ui.openTaskId) { closePanel(); return; }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || ui.modals.length) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); closePanel(); startNewTask(); }
  else if (e.key === '/') { e.preventDefault(); openSearch(); }
});

  try { state = normalizeState(JSON.parse(e.newValue)); applyTheme(); renderTopbar(); renderMain(); if (ui.openTaskId) renderPanel(); } catch (err) { /* ignore */ }

 * feature works unchanged. After each save() we diff the state against a "shadow" of what
 * the server already has, queue the changed rows (persisted in localStorage, so they survive
 * reloads and offline periods) and upsert them. Realtime postgres_changes events from other

  if (o.tb === 'boards') { fresh.board.name = prev.board.name; fresh.members = clone(prev.members); return; }
  if (o.tb === 'buckets' || o.tb === 'labels') {
    const list = fresh[o.tb], i = find(list, o.id);
    if (o.op === 'delete') { if (i >= 0) list.splice(i, 1); return; }
    const local = prev[o.tb].find(x => x.id === o.id); if (!local) return;
    if (i >= 0) list[i] = clone(local); else list.splice(Math.min(prev[o.tb].indexOf(local), list.length), 0, clone(local));
    return;
  }
  if (o.tb === 'tasks') {
    const i = find(fresh.tasks, o.id);
    if (o.op === 'delete') { if (i >= 0) fresh.tasks.splice(i, 1); return; }
    const local = prev.tasks.find(x => x.id === o.id); if (!local) return;
    const copy = clone(local);
    if (i >= 0) { const server = fresh.tasks[i].comments; server.forEach(c => { if (!copy.comments.some(x => x.id === c.id) && !cloud.queue.some(q2 => q2.tb === 'comments' && q2.id === c.id)) copy.comments.push(c); }); fresh.tasks[i] = copy; }
    else fresh.tasks.push(copy);
    return;
  }
  if (o.tb === 'comments') {
    if (o.op === 'delete') { fresh.tasks.forEach(x => { x.comments = x.comments.filter(c => c.id !== o.id); }); return; }
    const task = fresh.tasks.find(x => x.id === o.row.task_id);
    const ptask = prev.tasks.find(x => x.id === o.row.task_id);
    const local = ptask && ptask.comments.find(c => c.id === o.id);
    if (task && local && !task.comments.some(c => c.id === o.id)) task.comments.push(clone(local));
  }
}

function subscribe() {
  if (cloud.channel) { cloud.sb.removeChannel(cloud.channel); cloud.channel = null; }
  cloud.subscribedOnce = false;
  const id = cloud.boardId;
  const ch = cloud.sb.channel('bst-board-' + id);
  ['buckets', 'labels', 'tasks', 'comments', 'board_members'].forEach(tb => {
    ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: tb, filter: 'board_id=eq.' + id }, p => onRealtime(tb, p));
    ch.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: tb, filter: 'board_id=eq.' + id }, p => onRealtime(tb, p));
    // DELETE events can't be filtered by column; we ignore ids that aren't on this board
    ch.on('postgres_changes', { event: 'DELETE', schema: 'public', table: tb }, p => onRealtime(tb, p));
  });
  ch.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'boards', filter: 'id=eq.' + id }, p => onRealtime('boards', p));
  ch.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      if (cloud.subscribedOnce) reloadSoon(); // reconnected: catch up on anything we missed
      cloud.subscribedOnce = true;
    }
  });
  cloud.channel = ch;
}

function loadScript(src) {

    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = resolve; s.onerror = () => { s.remove(); reject(new Error('load ' + src)); };
    document.head.appendChild(s);

}
function appUrl() { return location.origin + location.pathname; }

  }
  appMode = 'cloud';
  state = prefState(); applyTheme();

  const cache = readCache();
  if (!window.supabase || !window.supabase.createClient) {
    if (cache && cache.state) { startFromCache(cache); setNet(false); } else showGate('offline');
    return;
  }

  if (!session && cache && cache.state && !navigator.onLine) { startFromCache(cache); setNet(false); return; }
  if (!session) {
    showGate('login', { error: hashErr ? decodeURIComponent(hashErr[1].replace(/\+/g, ' ')) : '' });
    if (hashErr) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }

function startFromCache(c) {

  cloud.email = c.email || ''; cloud.boardId = c.boardId; cloud.role = c.role; cloud.boards = c.boards || [];
  cloud.access = c.access || []; cloud.canCreate = !!c.canCreate;
  cloud.rows = c.rows || emptyMaps(); cloud.shadow = c.shadow || emptyMaps(); cloud.queue = c.queue || []; cloud.seq = c.seq || cloud.queue.length; cloud.offset = c.offset || 0;

    if (location.hash && /access_token|refresh_token|type=magiclink/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
    const cache = readCache();

    try {
      const t0 = Date.now(); const r = await cloud.sb.rpc('server_now'); const t1 = Date.now();
      if (!r.error && r.data) cloud.offset = Date.parse(r.data) - (t0 + t1) / 2;

}

/* ---------- invitations through the "invite-member" Edge Function ---------- */
// The function runs on Supabase and uses the admin key from ITS OWN environment (never shipped to browsers).
// The browser only sends the signed-in user's JWT (added by functions.invoke).
async function inviteMember(email, role) {
  if (cloud.inviteFn === false) return { fallback: true };
  try {
    const { data, error } = await cloud.sb.functions.invoke('invite-member', {
      body: { board_id: cloud.boardId, email, role, redirect_to: appUrl() }
    });
    if (!error && data && data.ok) { cloud.inviteFn = true; return data; }
    let body = data, status = 0;
    const ctx = error && error.context;
    if (ctx && typeof ctx.json === 'function') {
      status = ctx.status || 0;
      try { body = await ctx.clone().json(); } catch (e) { body = null; }
    }
    if (body && body.ok === false && body.error) { cloud.inviteFn = true; return { ok: false, status, message: body.message || body.error }; }
    // No JSON from our function: not deployed (404), relay/fetch error, gateway error → fall back.
    if (!status || status === 404 || status >= 500) { cloud.inviteFn = false; return { fallback: true }; }
    return { ok: false, status, message: (error && error.message) || 'HTTP ' + status };
  } catch (e) { cloud.inviteFn = false; return { fallback: true }; }
}
function inviteResultText(r, email) {
  if (r.fallback) return t('inviteNoFn', { email });
  if (r.status === 'invited') return t('inviteSent', { email });
  if (r.status === 'magic_link_sent') return t('inviteLinkSent', { email });
  return t('inviteNoMail', { email, msg: r.email_error || '?' });
}

/* ---------- backup & one-time import of the old local board ---------- */
function downloadBackup() {
  const name = (state.board.name || 'board').replace(/[^\w-]+/g, '-').toLowerCase();
  const data = {
    kind: 'bst-planner-backup', version: 1, exportedAt: new Date().toISOString(),
    source: appMode === 'cloud' ? { supabaseUrl: SUPABASE_URL, boardId: cloud.boardId, signedInAs: cloud.email, access: cloud.access.map(a => ({ email: a.email, role: a.role, pending: !a.user_id })) } : { local: true },
    state
  };
  downloadText(`bst-backup-${name}-${todayISO()}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast(t('backupDone'));
}
function readLocalBoard() {
  const raw = storage.get(STORAGE_KEY); if (!raw) return null;
  try { const s = normalizeState(JSON.parse(raw)); return s; } catch (e) { return null; }
}
function importedInfo() { try { return JSON.parse(storage.get(IMPORTED_KEY) || 'null'); } catch (e) { return null; } }
function localImportAvailable() { const s = readLocalBoard(); return !!(s && s.tasks.length && !importedInfo() && cloud.role !== 'viewer'); }
function renderImportLocalBox(rerender) {
  const info = importedInfo(); const local = readLocalBoard();
  const box = h('div', { class: 'import-box' }, h('div', { class: 'section-title' }, icon('upload', 14), t('importLocal')));
  if (info) box.appendChild(h('p', { class: 'muted', style: { margin: 0 } }, t('importLocalAlready', { when: fmtStamp(info.at) })));
  else if (!local || !local.tasks.length) box.appendChild(h('p', { class: 'muted', style: { margin: 0 } }, t('importLocalNone')));
  else {
    box.appendChild(h('p', { class: 'muted', style: { margin: 0 } }, t('importLocalHint')));
    box.appendChild(h('div', null, h('button', { class: 'btn primary', id: 'importLocalBtn', disabled: cloud.role === 'viewer', onClick: () => importLocalData(rerender) }, icon('upload'), t('importLocal') + ' (' + local.tasks.length + ')')));
  }
  return box;
}
/** Merge the old localStorage board into the shared board (new UUIDs, buckets/labels/people matched by name). */
function importLocalData(after) {
  const local = readLocalBoard();
  if (!local || !local.tasks.length) { toast(t('importLocalNone')); return; }
  if (importedInfo()) { toast(t('importLocalAlready', { when: fmtStamp(importedInfo().at) })); return; }
  confirmDialog(t('importLocal'), t('importLocalConfirm', { n: local.tasks.length, board: state.board.name }), t('importLocal'), () => {
    const map = {};
    const norm = (s) => String(s || '').trim().toLowerCase();
    local.buckets.forEach(b => {
      const ex = state.buckets.find(x => norm(x.name) === norm(b.name));
      if (ex) map[b.id] = ex.id; else { const nb = Object.assign(clone(b), { id: newUuid() }); state.buckets.push(nb); map[b.id] = nb.id; }
    });
    local.labels.forEach(l => {
      const ex = state.labels.find(x => (l.name ? norm(x.name) === norm(l.name) : (!x.name && x.color === l.color)));
      if (ex) map[l.id] = ex.id;
      else if (state.labels.length < MAX_LABELS) { const nl = Object.assign(clone(l), { id: newUuid() }); state.labels.push(nl); map[l.id] = nl.id; }
    });
    local.members.forEach(m => {
      const ex = state.members.find(x => (m.email && norm(x.email) === norm(m.email)) || norm(x.name) === norm(m.name));
      if (ex) { map[m.id] = ex.id; if (!ex.email && m.email) ex.email = m.email; }
      else { const nm = Object.assign(clone(m), { id: uid('m') }); state.members.push(nm); map[m.id] = nm.id; }
    });
    const minOrder = state.tasks.reduce((mn, x) => Math.min(mn, x.order), 0);
    const maxLocal = local.tasks.reduce((mx, x) => Math.max(mx, x.order), 0);
    local.tasks.forEach(x => {
      const nt = clone(x);
      nt.id = newUuid();
      nt.bucketId = map[x.bucketId] || state.buckets[0].id;
      nt.labels = x.labels.map(id => map[id]).filter(Boolean);
      nt.assignees = x.assignees.map(id => map[id]).filter(Boolean);
      nt.createdBy = map[x.createdBy] || x.createdBy; nt.completedBy = x.completedBy ? (map[x.completedBy] || x.completedBy) : null;
      nt.comments = x.comments.map(c => Object.assign({}, c, { id: newUuid(), author: map[c.author] || c.author }));
      nt.order = minOrder - 1 - (maxLocal - x.order);
      state.tasks.push(nt);
    });
    storage.set(IMPORTED_KEY, JSON.stringify({ at: Date.now(), boardId: cloud.boardId, tasks: local.tasks.length }));
    commit({ panel: true });
    toast(t('importLocalDone', { n: local.tasks.length }));
    if (typeof after === 'function') after();
  });
}

/* ---------- sign-in / setup screens ---------- */
function hideGate() { const g = document.getElementById('gate'); if (g) g.remove(); document.body.classList.remove('gated'); }
function showGate(kind, opts = {}) {
  hideGate();
  document.body.classList.add('gated');
  const card = h('div', { class: 'gate-card', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'gateTitle' });
  const gate = h('div', { id: 'gate', 'data-gate': kind }, card);
  const add = (...kids) => appendKids(card, kids); // skips null children
  const langBtn = h('button', {
    class: 'btn gate-lang', onClick: () => {
      state.board.lang = state.board.lang === 'de' ? 'en' : 'de';
      const p = loadPrefs(); p.lang = state.board.lang; storage.set(PREFS_KEY, JSON.stringify(p));
      applyTheme(); showGate(kind, Object.assign({}, opts, { keep: true }));
    }
  }, state.board.lang === 'de' ? 'English' : 'Deutsch');
  const head = (title) => [h('div', { class: 'gate-brand' }, h('div', { class: 'project-chip' }, PROJECT), h('span', { class: 'muted' }, DEFAULT_BOARD_NAME)), h('h1', { id: 'gateTitle' }, title)];
  const msg = h('p', { class: 'gate-msg', role: 'alert' }, opts.error ? t('linkErr', { msg: opts.error }) : '');
  if (kind === 'configure') {
    add(...head(t('cfgTitle')), h('p', null, t('cfgText')),
      h('pre', { class: 'gate-code' }, "const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';\nconst SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';"),
      h('p', { class: 'muted' }, t('cfgLocalHint')),
      h('div', { class: 'gate-actions' }, h('button', { class: 'btn', id: 'useLocalBtn', onClick: () => { storage.set(MODE_KEY, 'local'); hideGate(); init(); } }, t('cfgLocal')), langBtn));
  } else if (kind === 'login') {
    const email = h('input', { class: 'input', id: 'loginEmail', type: 'email', autocomplete: 'email', placeholder: 'name@company.com', 'aria-label': t('inviteEmail'), value: opts.email || '' });
    const btn = h('button', { class: 'btn primary', id: 'sendLinkBtn', type: 'submit' }, t('sendLink'));
    const form = h('form', { class: 'gate-form', onSubmit: async (e) => {
      e.preventDefault();
      const v = email.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { msg.textContent = t('inviteBad'); email.focus(); return; }
      btn.disabled = true; btn.textContent = t('sending'); msg.textContent = '';
      const { error } = await cloud.sb.auth.signInWithOtp({ email: v, options: { emailRedirectTo: appUrl(), shouldCreateUser: true } });
      btn.disabled = false; btn.textContent = t('sendLink');
      if (error) { msg.textContent = t('loginErr', { msg: error.message }); return; }
      showGate('checkEmail', { email: v });
    } }, email, btn);
    add(...head(t('loginTitle', { project: PROJECT })), h('p', null, t('loginText')), form, msg,
      location.protocol === 'file:' ? h('p', { class: 'gate-msg' }, t('fileProtoWarn')) : null,
      h('div', { class: 'gate-actions' }, langBtn));
    setTimeout(() => email.focus(), 30);
  } else if (kind === 'checkEmail') {
    const code = h('input', { class: 'input', id: 'otpCode', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 10, placeholder: t('code'), 'aria-label': t('code') });
    const form = h('form', { class: 'gate-form', onSubmit: async (e) => {
      e.preventDefault();
      const { error } = await cloud.sb.auth.verifyOtp({ email: opts.email, token: code.value.trim(), type: 'email' });
      if (error) msg.textContent = t('codeErr', { msg: error.message });
    } }, code, h('button', { class: 'btn primary', type: 'submit' }, t('verify')));
    add(...head(t('checkEmail')), h('p', null, t('checkEmailText', { email: opts.email })), form, msg,
      h('div', { class: 'gate-actions' },
        h('button', { class: 'btn', onClick: () => showGate('login', { email: opts.email }) }, t('otherEmail')),
        h('button', { class: 'btn', onClick: async () => { const { error } = await cloud.sb.auth.signInWithOtp({ email: opts.email, options: { emailRedirectTo: appUrl() } }); msg.textContent = error ? t('loginErr', { msg: error.message }) : t('checkEmail') + ' ✓'; } }, t('resend')),
        langBtn));
  } else if (kind === 'notInvited') {
    const nameIn = h('input', { class: 'input', id: 'firstBoardName', value: DEFAULT_BOARD_NAME, maxlength: 120, 'aria-label': t('boardName') });
    add(...head(t(cloud.canCreate ? 'ownerStartTitle' : 'notInvitedTitle')), h('p', null, t(cloud.canCreate ? 'ownerStartText' : 'notInvitedText', { email: cloud.email })),
      cloud.canCreate ? h('div', { class: 'gate-create' }, h('p', null, t('createBoardText')),
        h('div', { class: 'gate-form' }, nameIn, h('button', { class: 'btn primary', id: 'createBoardBtn', onClick: async (e) => { e.target.disabled = true; await createBoard(nameIn.value.trim()); e.target.disabled = false; } }, t('createBoard')))) : null,
      msg,
      h('div', { class: 'gate-actions' },
        h('button', { class: 'btn', id: 'checkAgainBtn', onClick: async () => { showGate('loading'); try { await cloud.sb.rpc('claim_invites'); await enterBoards(false); } catch (e) { showGate('offline'); } } }, t('checkAgain')),
        h('button', { class: 'btn', onClick: signOut }, icon('logout'), t('signOut')), langBtn));
  } else if (kind === 'loading') {
    add(...head(t('loadingBoard')), h('div', { class: 'gate-spinner', 'aria-hidden': 'true' }));
  } else if (kind === 'offline') {
    add(...head(t('syncOffline', { n: 0 }).replace(/\s*\(.*\)/, '')), h('p', null, t('offlineNoCache')),
      h('div', { class: 'gate-actions' }, h('button', { class: 'btn primary', onClick: () => location.reload() }, t('retry')), langBtn));
  }
  document.body.appendChild(gate);
}

/* ---------- connectivity ---------- */
window.addEventListener('online', async () => {
  if (appMode !== 'cloud') return;
  if (!cloud.sb) { location.reload(); return; }
  cloud.netDown = false; renderSync();
  if (!cloud.active || !cloud.user || !cloud.user.aud) {
    const r = await cloud.sb.auth.getSession().catch(() => null);
    const s = r && r.data && r.data.session;
    if (s) { cloud.user = null; await onSignedIn(s); }
    return;
  }
  const hadPending = cloud.queue.length;
  await flush();
  reloadSoon();
  if (hadPending && !cloud.queue.length) toast(t('backOnline'));
});
window.addEventListener('offline', () => { if (appMode === 'cloud') setNet(false); });
setInterval(() => { if (appMode === 'cloud' && cloud.active && cloud.queue.length && !cloud.flushing && navigator.onLine) flush(); }, 5000);
window.addEventListener('beforeunload', () => { if (appMode === 'cloud' && cloud.active) { syncDiff(); cloudPersist(); } });
boot();
</script>
